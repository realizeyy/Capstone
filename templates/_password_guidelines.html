<div class="pwd-guidelines" id="pwdGuidelines" role="region" aria-label="Password guidelines">
  <div class="pwd-guidelines-header">
    <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
    <span class="pwd-guidelines-title">Password guidelines</span>
  </div>
  <ul class="pwd-guidelines-list" aria-label="Password requirements list">
    <li class="pwd-rule" data-rule="length">
      <span class="pwd-rule-icon" aria-hidden="true"><i class="fa-solid fa-circle"></i></span>
      <span class="pwd-rule-label">At least 8 characters long</span>
      <span class="pwd-sr-only" data-rule-sr>Not satisfied</span>
    </li>
    <li class="pwd-rule" data-rule="mixed">
      <span class="pwd-rule-icon" aria-hidden="true"><i class="fa-solid fa-circle"></i></span>
      <span class="pwd-rule-label">Cannot be numbers only (mix letters and numbers)</span>
      <span class="pwd-sr-only" data-rule-sr>Not satisfied</span>
    </li>
    <li class="pwd-rule" data-rule="diff">
      <span class="pwd-rule-icon" aria-hidden="true"><i class="fa-solid fa-circle"></i></span>
      <span class="pwd-rule-label">Different from current password or username</span>
      <span class="pwd-sr-only" data-rule-sr>Not satisfied</span>
    </li>
    <li class="pwd-rule" data-rule="match">
      <span class="pwd-rule-icon" aria-hidden="true"><i class="fa-solid fa-circle"></i></span>
      <span class="pwd-rule-label">Passwords must match</span>
      <span class="pwd-sr-only" data-rule-sr>Not satisfied</span>
    </li>
  </ul>
</div>
